name: MuLIB
version: 0.1.0
language: C11
header_only: true
implementation_model: ABI modules define MULIB_IMPL_<MODULE> in one translation unit; bounded static-inline and static-data modules require no switch.
inspiration:
- ctl (user-supplied)
- klib (user-supplied)
license: MIT
module_count: 2059
implemented_module_count: 1557
bounded_module_count: 502
modules:
- name: container-core
  header: kernels/mulib-container-core.h
  manual: manual/mulib-container-core.md
  implementation: static-inline
  purpose: Shared checked storage, wire primitives and errors for containers.
  dependencies: []
  status: bounded
  example: examples/modules/container-core.c
- name: qvm
  header: kernels/mulib-qvm.h
